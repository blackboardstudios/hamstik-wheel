[package]
name = "hamstik-wheel"
version = "0.1.0"
edition = "2021"
description = "Autonomous Hamstik work-item implementation and review loop powered by Pi"
license = "Apache-2.0"
repository = "https://github.com/blackboardstudios/hamstik-wheel"
homepage = "https://github.com/blackboardstudios/hamstik-wheel"
readme = "README.md"
keywords = ["hamstik", "pi", "agent", "automation", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.13"
